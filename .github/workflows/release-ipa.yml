name: Build and publish IPA

on:
  push:
    branches: [main]
    paths:
      - "DriveVerse/**"
      - "DriveVerseWidgets/**"
      - "project.yml"
      - "scripts/**"
      - ".github/workflows/release-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: bash scripts/generate.sh

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project DriveVerse.xcodeproj \
            -scheme DriveVerse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/DriveVerse.app"
          test -d "$app"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry CarPlayLyrics-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayLyrics-unsigned-ipa
          path: CarPlayLyrics-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarPlay Lyrics build ${{ github.run_number }}
          body: |
            Automatically built from commit `${{ github.sha }}`.

            Download `CarPlayLyrics-unsigned.ipa` below and install/sign it with AltStore, SideStore, Sideloadly, or another sideloading tool. This package is unsigned and cannot be installed directly by tapping it on an iPhone.

            This build targets iOS 17+ for the app and preview. Actual Live Activity mirroring to CarPlay requires iOS 26+.
          prerelease: false
          make_latest: true
          files: CarPlayLyrics-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carplay-lyrics-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
