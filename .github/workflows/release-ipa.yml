name: Build and publish IPA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate.sh

      - name: Import signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          test -n "$APP_PROFILE_BASE64"
          test -n "$WIDGET_PROFILE_BASE64"
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          echo "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision")")
          WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/widget.mobileprovision")")
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_PROFILE_UUID.mobileprovision"
          cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"
          echo "APP_PROFILE_UUID=$APP_PROFILE_UUID" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_UUID=$WIDGET_PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive app
        run: |
          xcodebuild -project DriveVerse.xcodeproj -scheme DriveVerse \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CarPlayLyrics.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_UUID" \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.siguyyy.carplaylyrics</key><string>$APP_PROFILE_UUID</string>
              <key>com.siguyyy.carplaylyrics.widgets</key><string>$WIDGET_PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.siguyyy.carplaylyrics $APP_PROFILE_UUID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.siguyyy.carplaylyrics.widgets $WIDGET_PROFILE_UUID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CarPlayLyrics.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/DriveVerse.ipa" "$RUNNER_TEMP/CarPlayLyrics.ipa"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/CarPlayLyrics.ipa" \
              --title "CarPlay Lyrics $GITHUB_REF_NAME" --generate-notes
          else
            echo "Manual run built the IPA at $RUNNER_TEMP/CarPlayLyrics.ipa; tag a version to publish a release."
          fi
